name: MeowMusic
options:
  bundleIdPrefix: com.michaelruta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TTAWM56998
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES

targets:
  MeowMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeowMusic
        excludes:
          - "Resources/Info.plist"
    info:
      path: MeowMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Meow Music
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: AppBlack
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MeowMusic.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelruta.MeowMusic
        PRODUCT_NAME: MeowMusic
    schemes:
      MeowMusic:
        build:
          targets:
            MeowMusic: all
        run:
          config: Debug
