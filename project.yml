name: MeowMusic
options:
  bundleIdPrefix: com.michaelruta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TTAWM56998
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  MeowMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeowMusic
        excludes:
          - "Resources/Info.plist"
    info:
      path: MeowMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Meow Music
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1041730774018-4ao6k3oo7hcf3vm2ju1qh7ul13c6o6rv
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: AppBlack
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelruta.MeowMusic
        PRODUCT_NAME: MeowMusic
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    schemes:
      MeowMusic:
        build:
          targets:
            MeowMusic: all
        run:
          config: Debug
